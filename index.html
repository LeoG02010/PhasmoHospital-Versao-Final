        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function gameLoop() {
            AudioSystem.updateMusicScene();
            if (GameState.isPaused) { requestAnimationFrame(gameLoop); return; }
            if(darknessTicks>0) { darknessTicks-=gameSpeedMultiplier; if(darknessTicks<=0) document.getElementById('darkness-overlay').style.opacity='0'; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (GameState.current === 'MENU') {
                ctx.fillStyle = '#050408';
                ctx.fillRect(0, 0, 320, 180);
            } else if (GameState.current === 'CORRIDOR') {
                Player.update();
                const cameraX = Math.max(0, Math.min(Player.x - 160, 620));
                Corridor.draw(ctx, cameraX);
                
                updateAndDrawProjectiles(ctx, cameraX, 0);
                updateAndDrawCrucifixEffects(ctx, cameraX, 0);
                Player.draw(ctx, cameraX);

            } else if (GameState.current === 'ROOM_RED') {
                drawConsultorio();
            } else if (GameState.current === 'ROOM_TRANSITION') {
                ctx.fillStyle = '#0a0314';
                ctx.fillRect(0, 0, 320, 180);
            } else if (GameState.current === 'INFIRMARY' || GameState.current === 'ROOM_BLUE' || GameState.current === 'ROOM_AQUA' || GameState.current === 'ROOM_GREEN' || GameState.current === 'ROOM_YELLOW' || GameState.current === 'ROOM_ORANGE' || GameState.current === 'ROOM_RED') {
                Player.update();
                Infirmary.updateCamera(Player.currentFloor);
                Infirmary.draw(ctx);
                
                updateAndDrawGhosts(ctx, Infirmary.cameraY);
                updateAndDrawProjectiles(ctx, 0, Infirmary.cameraY);
                updateAndDrawCrucifixEffects(ctx, 0, Infirmary.cameraY);
                Player.draw(ctx, 0, Infirmary.cameraY);
            } else if (GameState.current === 'GAME_OVER') {
                ctx.fillStyle = '#050408';
                ctx.fillRect(0, 0, 320, 180);
            }

            if (damageFlashTimer > 0) {
                damageFlashTimer -= 1 * gameSpeedMultiplier;
                ctx.fillStyle = 'rgba(255, 0, 0, 0.25)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            requestAnimationFrame(gameLoop);
        }

        function updateAndDrawProjectiles(ctx, cameraX, cameraY) {
            if (GameState.isPaused) return;
            if (bossDefeatedSequence) return;
            for (let i = Projectiles.length - 1; i >= 0; i--) {
                let p = Projectiles[i];
                if (!GameState.isPaused) {
                    p.x += p.vx * gameSpeedMultiplier;
                    p.y += p.vy * gameSpeedMultiplier;
                    p.vy += p.gravity * gameSpeedMultiplier;
                    p.rotation += 0.2 * gameSpeedMultiplier;
                }

                let floorY = 120;
                if (GameState.current === 'INFIRMARY' || GameState.current === 'ROOM_BLUE' || GameState.current === 'ROOM_AQUA' || GameState.current === 'ROOM_GREEN' || GameState.current === 'ROOM_YELLOW' || GameState.current === 'ROOM_ORANGE' || GameState.current === 'ROOM_RED') {
                    floorY = Infirmary.floors[Player.currentFloor];
                }

                let projectileHit = GameState.current === 'ROOM_RED' && Boss7.active ? Boss7.hit(p) : false;

                if (GameState.current === 'INFIRMARY' && bossActive && boss) {
                    let bossDist = Math.hypot(p.x - boss.x, p.y - boss.y);
                    if (bossDist < 25 && boss.state !== 'DYING') {
                        projectileHit = true;
                        if (boss.state === 'VULNERABLE') {
                            boss.health--; 
                            AudioSystem.playGhostDieSound();
                            showInteractionMsg(`Boss atingido! Vida: ${boss.health}/${boss.maxHealth}`);

                            if (boss.health <= 0) {
                                startBossDeathAnimation();
                            } else {
                                boss.state = 'DISAPPEARED';
                                boss.stateTimer = 45;
                            }
                        } else {
                            showInteractionMsg("O boss está invulnerável agora!");
                        }
                    }
                }

                if (GameState.current === 'ROOM_BLUE' && Boss2Controller.active) {
                    let b2Dist = Math.hypot(p.x - Boss2Controller.x, p.y - (Boss2Controller.y - 20));
                    if (b2Dist < 25) {
                        projectileHit = true;
                        Boss2Controller.takeDamage(1);
                    }
                }

                if (GameState.current === 'ROOM_AQUA' && Boss3Controller.active) {
                    let b3Dist = Math.hypot(p.x - Boss3Controller.x, p.y - (Boss3Controller.y - 20));
                    if (b3Dist < 25) {
                        projectileHit = true;
                        Boss3Controller.takeDamage(1);
                    }
                }

                if (GameState.current === 'ROOM_GREEN' && Boss4Controller.active) {
                    let b4Dist = Math.hypot(p.x - Boss4Controller.x, p.y - (Boss4Controller.y - 20));
                    if (b4Dist < 25) {
                        projectileHit = true;
                        Boss4Controller.takeDamage(1);
                    }
                }

                if (GameState.current === 'ROOM_YELLOW' && Boss5Controller.active) {
                    if (Boss5Controller.attackType === 3) {
                        if (Boss5Controller.checkShotOnBox(p.x, p.y)) {
                            projectileHit = true;
                        }
                    } else {
                        let b5Dist = Math.hypot(p.x - Boss5Controller.x, p.y - (Boss5Controller.y - 20));
                        if (b5Dist < 25) {
                            projectileHit = true;
                            Boss5Controller.takeDamage(1);
                        }
                    }
                }

                if (GameState.current === 'ROOM_ORANGE' && Boss6Controller.active) {
                    let b6Dist = Math.hypot(p.x - Boss6Controller.x, p.y - (Boss6Controller.y - 20));
                    if (b6Dist < 25) {
                        projectileHit = true;
                        Boss6Controller.takeDamage(1);
                    }
                }
                
                if (!projectileHit && (GameState.current === 'INFIRMARY' || GameState.current === 'ROOM_BLUE' || GameState.current === 'ROOM_AQUA' || GameState.current === 'ROOM_GREEN' || GameState.current === 'ROOM_YELLOW' || GameState.current === 'ROOM_ORANGE' || GameState.current === 'ROOM_RED')) {
                    for (let j = ghosts.length - 1; j >= 0; j--) {
                        let g = ghosts[j];
                        let dist = Math.hypot(p.x - g.x, p.y - g.y);
                        if (dist < 20) {
                            ghosts.splice(j, 1);
                            registerGhostKills(1);
                            projectileHit = true;
                            AudioSystem.playGhostDieSound();
                            showInteractionMsg("Fantasma exorcizado!");
                            
                            checkBossSpawnCondition();
                            break;
                        }
                    }
                }

                if (projectileHit) {
                    Projectiles.splice(i, 1);
                    continue;
                }

                const screenX = Math.floor(p.x - cameraX);
                const screenY = Math.floor(p.y - cameraY);

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(p.rotation);
                ctx.fillStyle = '#e53935';
                ctx.fillRect(-2, -2, 4, 4);
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(0, -4, 2, 2);
                ctx.restore();

                if (p.y >= (p.floorY ?? floorY) || screenX < -20 || screenX > 340) {
                    Projectiles.splice(i, 1);
                }
            }
        }

        function updateAndDrawCrucifixEffects(ctx, cameraX, cameraY) {
            for (let i = crucifixEffects.length - 1; i >= 0; i--) {
                let fx = crucifixEffects[i];
                if (!GameState.isPaused) {
                    fx.timer += 1 * gameSpeedMultiplier;
                }

                const screenX = Math.floor(fx.x - cameraX);
                const screenY = Math.floor(fx.y - cameraY);
                const progress = fx.timer / fx.duration;
                const alpha = Math.sin(progress * Math.PI);

                ctx.save();
                ctx.translate(screenX, screenY);

                ctx.fillStyle = `rgba(168, 85, 247, ${alpha * 0.7})`;
                ctx.fillRect(-12, -12, 24, 24);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(-6, -6, 12, 12);

                ctx.fillStyle = '#c084fc';
                ctx.fillRect(-1, -6, 2, 12);
                ctx.fillRect(-4, -3, 8, 2);

                ctx.restore();

                if (fx.timer >= fx.duration) {
                    crucifixEffects.splice(i, 1);
                }
            }
        }

                GameState.keys[key] = true;

            if (key === 'e' && GameState.current === 'CORRIDOR') {

                } else if (rawKey === 'e') {
                    triggerDoorsCrucifix(Player.x, Player.y, Player.direction);

            }
            if (key === 'w' && !e.repeat) {
                Player.changeFloor(-1);
            }
            if (key === 's' && !e.repeat) {
                Player.changeFloor(1);
            }
        });

        let savedCorridorX = 60;
        function getCorridorCheckpointX() {
            if (GameState.current === 'CORRIDOR') return Math.max(30, Math.min(800, Player.x));
            let lastCleared = -1;
            Corridor.doors.forEach((door, index) => { if (door.isCleared) lastCleared = index; });
            return lastCleared < 0 ? 60 : Math.min(800, Corridor.doors[lastCleared + 1]?.x ?? 800);
        }
        function saveProgress() {
            savedCorridorX = getCorridorCheckpointX();
            const progress = {
                version: 1,
                doors: Corridor.doors.map(door => ({ isLocked: door.isLocked, isCleared: door.isCleared })),
                whiteKey,
                corridorX: savedCorridorX,
                achievements: unlockedAchievements,
                totalDeaths,
                totalGhostsKilled,
                currentRunDeaths,
                currentRunTookDamage,
                bossAttemptDeaths,
            };
            try {
                sessionStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(progress));
            } catch (error) {
                console.warn('Não foi possível salvar o progresso desta sessão.', error);
            }
        }
        function loadProgress() {
            try {
                // Remove progresso antigo permanente e carrega somente a sessão atual.
                localStorage.removeItem(PROGRESS_STORAGE_KEY);
                const progress = JSON.parse(sessionStorage.getItem(PROGRESS_STORAGE_KEY) || 'null');
                if (!progress || progress.version !== 1) return;
                if (Array.isArray(progress.doors)) {
                    Corridor.doors.forEach((door, index) => {
                        const savedDoor = progress.doors[index];
                        if (savedDoor) {
                            door.isLocked = !!savedDoor.isLocked;
                            door.isCleared = !!savedDoor.isCleared;
                        }
                    });
                }
                whiteKey = !!progress.whiteKey;
                unlockedAchievements = progress.achievements && typeof progress.achievements === 'object' ? progress.achievements : {};
                totalDeaths = Number.isFinite(progress.totalDeaths) ? progress.totalDeaths : 0;
                totalGhostsKilled = Number.isFinite(progress.totalGhostsKilled) ? progress.totalGhostsKilled : 0;
                currentRunDeaths = Number.isFinite(progress.currentRunDeaths) ? progress.currentRunDeaths : 0;
                currentRunTookDamage = !!progress.currentRunTookDamage;
                bossAttemptDeaths = progress.bossAttemptDeaths && typeof progress.bossAttemptDeaths === 'object' ? progress.bossAttemptDeaths : {};
                if (Number.isFinite(progress.corridorX)) savedCorridorX = Math.max(30, Math.min(800, progress.corridorX));
                Player.x = savedCorridorX;
                Player.currentFloor = 0;
                Player.y = 120;
            } catch (error) {
                console.warn('Não foi possível carregar o progresso desta sessão.', error);
            }
        }
        loadProgress();
        renderAchievements();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
